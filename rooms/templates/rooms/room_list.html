<!DOCTYPE html>
<html>
<head>
    <title>Room List</title>

    <style>
        body{
            font-family: Arial;
            background:#f4f4f4;
            padding:20px;
        }

        h1{
            text-align:center;
        }

        .room-card{
            background:white;
            padding:20px;
            margin:20px auto;
            width:500px;
            border-radius:10px;
            box-shadow:0 0 10px rgba(0,0,0,0.1);
        }

        .price{
            color:green;
            font-weight:bold;
        }
    </style>
</head>

<body>

<h1>Available Rooms</h1>

{% for room in rooms %}

<div class="room-card">

    <h2>Room {{ room.room_number }}</h2>

    <p>Type: {{ room.room_type }}</p>

    <p class="price">₹{{ room.price }}</p>

</div>

{% empty %}

<h2>No Rooms Available</h2>

{% endfor %}

</body>
</html>
